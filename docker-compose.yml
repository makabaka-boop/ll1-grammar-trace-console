services:
  grammar:
    build:
      context: ./backend
    environment:
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

  desk:
    build:
      context: ./frontend
    depends_on:
      grammar:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped
